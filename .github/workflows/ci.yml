name: CI

# The whole file. If this repository ever grows a job of its own, `cfctl doctor` reports it as a
# bespoke CI file and the count in docs/ecosystem/03 §5 stops being zero — which is the signal
# that the reusable workflow needs an input, not that this repository needs its own copy.

on:
  push:
    # `release/**` builds too. A release branch carries the estate-wide version bump, and it has to
    # publish its images before testnet can be deployed from it — which is what proves the release
    # before anything is merged. Mainnet is unaffected: it pins a version tag.
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: agora
      # ── FIVE DATABASES, DECLARED, BECAUSE THIS DEPLOYABLE IS FIVE MODULES ──────────────────
      #
      # Wave M5a of micro-deploy `docs/service-merge-plan.md`: agora absorbed devplatform, policy,
      # pricing and studio as the seed of `platform`. The schemas are NOT merged — `inbox` and
      # `jobs` exist in ALL FIVE, with `outbox`, `event_subscriptions` and `outbox_deliveries` in
      # four — so the reusable workflow creates `ci_agora_test`, `ci_devplatform_test`,
      # `ci_policy_test`, `ci_pricing_test` and `ci_studio_test` and exports the `_TEST_` pair for
      # each. Pointing any two at one database would let one suite's TRUNCATE empty another's rows
      # mid-test, which reads as a flake rather than as a configuration mistake.
      #
      # AND THE SKIP SCAN IS WHY EVERY NAME MUST BE HERE RATHER THAN LEFT IMPLICIT. A name in this
      # list is treated as OWN: if its suite skips, the build FAILS. A name absent from it skipping
      # would be filed as "a cross-service tier stood down" and go green — which is exactly the
      # false green that block exists to end, and it would hide 340 devplatform, 110 policy, 118
      # pricing and 225 studio tests not running.
      #
      # `skipped 0` is NOT evidence on its own: node:test does not count the cases inside a
      # `describe` it never entered. `src/merged.test.ts` and `src/studio/boot.test.ts` both name
      # every missing variable in their skip reason for exactly that reason.
      #
      # `_TESTNET` names are deliberately NOT here: the workflow's suffix check demands
      # `%_DATABASE_URL` and would fail the build on `AGORA_DATABASE_URL_TESTNET`. Nothing is lost
      # — no suite reads a testnet DSN.
      # Wave M5b added the commerce/games tier — seven more databases, none merged. Twelve then.
      #
      # Wave M5c added FOUR more on TWO absorbed repositories: activity brought notify (merged into
      # it in wave M2) and lantern brought analytics (wave M1b), and both nestings are preserved
      # rather than flattened. Sixteen databases now, and the last two names below are the ones
      # nobody would think to declare — they belong to modules that are two directories deep.
      #
      # `src/suitecomposition.test.ts` reads THIS LIST against the sixteen `testsupport.ts` files and
      # fails if a module has a harness and no database here, because that module's suites would
      # skip and the skip scan would file it as a tier standing down.
      database-env-var: >-
        AGORA_DATABASE_URL DEVPLATFORM_DATABASE_URL POLICY_DATABASE_URL
        PRICING_DATABASE_URL STUDIO_DATABASE_URL COMMUNITY_DATABASE_URL
        MARKET_DATABASE_URL BILLING_DATABASE_URL MINT_DATABASE_URL
        FORESIGHT_DATABASE_URL WORLDS_DATABASE_URL TESSERA_DATABASE_URL
        ACTIVITY_DATABASE_URL NOTIFY_DATABASE_URL LANTERN_DATABASE_URL
        ANALYTICS_DATABASE_URL TRADE_DATABASE_URL WALLET_DATABASE_URL
        ADMIN_API_DATABASE_URL EMBERKIN_DATABASE_URL AETHERHOLM_DATABASE_URL
        NDA_DATABASE_URL
      # The port the IMAGE binds, which is what the smoke test probes — `src/env.ts` defaults PORT
      # to 4150 and nothing below sets it. The estate overrides PORT to 4000 like every other
      # service and maps 127.0.0.1:4150 to it; that is a deployment fact and not this one.
      port: 4150
      # The image startup smoke test boots the real service, and `env.ts` validates its whole
      # configuration at import — so the container needs the variables it declares, not just a
      # database, or it exits before it serves /livez. The URLs are CI-only NON-secrets, never
      # dialled because /livez makes no outbound call, and never a real credential.
      #
      # `OUTBOX_SIGNING_SECRET=@generate` RATHER THAN A LITERAL, and the reason is micro-org #142: a
      # 40-character placeholder that "only had to clear a length check" sat on 44 containers and
      # passed every guard in the estate. `env.ts` runs `@cloudsforge/secrets`, which refuses a value
      # that is not SHAPED like a generated secret, and it has no CI exemption on purpose — an
      # escape hatch is reached for in exactly the hurry that produced the defect. CI does not need
      # a WEAK secret, it needs A secret: nothing here verifies a signature against anything else,
      # so the shared workflow expands `@generate` into a fresh `openssl rand -base64 48` per run
      # and throws it away.
      #
      # `AGORA_IDENTITY_CREDENTIAL=@credential` for the same family of reasons (micro-org #222): the
      # weaker guard a placeholder clears is the guard that let a JWT expired for 26 hours sit in
      # that variable on a healthy live container. `@credential` mints `cfsc_` + 43 base64url
      # characters per run — and because base64url includes `-` and `_`, runs exercise BOTH the
      # hyphenated shape and the alphanumeric one, which is the asymmetry that would otherwise boot
      # one estate and kill the other.
      #
      # IDENTITY_URL is deliberately absent: it defaults to IDENTITY_ISSUER, which is set here.
      # POLICY_URL is absent too, and its absence is the supported mode worth smoking — `env.ts`
      # returns `''`, `policyclient.ts` reports DEGRADED rather than pretending a decision, and no
      # moderation call is made at boot. That mode is now MORE interesting rather than less: policy
      # runs inside this same process, so an unset POLICY_URL is a gate that is absent from a
      # container that is holding the gate.
      #
      # ── WHAT WAVE M5a ADDED TO THIS LIST: TWO LINES ─────────────────────────────────────────
      #
      # `DEVPLATFORM_INGEST_SECRETS` and `STUDIO_ASSET_ROOT`, and nothing else. The four modules'
      # database URLs arrive from `database-env-var` above, and every other variable they read —
      # `IDENTITY_*`, `OUTBOX_SIGNING_SECRET` — is already here under the same estate-wide name.
      # That this list grew by two lines IS the merge's argument stated as configuration.
      #
      # Neither is decoration. `DEVPLATFORM_INGEST_SECRETS` is REQUIRED by that module's `env.ts`
      # and the container would exit before serving /livez without it; it is `@generate` rather than
      # a literal for the same micro-org #142 reason as the line above it. `STUDIO_ASSET_ROOT` is
      # the variable whose absence once resolved to a root-owned `/app/out` under a non-root user —
      # every generation failed EACCES while the container reported healthy — and the merged process
      # now refuses to BOOT on an unwritable root, so without this line the smoke test would fail
      # with the check working.
      #
      # ── WHAT WAVE M5c ADDED: SEVEN LINES, SIX OF THEM KEY MATERIAL ──────────────────────────
      #
      # Every one is REQUIRED at import by one of the four modules M5c brought in — their `env.ts`
      # files call `process.exit(1)` on an incomplete configuration, so the container would exit
      # before serving /livez without them. Six are `@generate` because `@cloudsforge/secrets`
      # refuses a value that is not SHAPED like a generated one, and has no CI exemption on purpose.
      #
      # `ANALYTICS_PSEUDONYM_KEY` is the one to read twice. In the estate it is a GDPR-sensitive
      # derivation key that CANNOT be rotated without orphaning every subject key derived under it,
      # so there is no remediation for a leak. A fresh one per run is harmless here and ONLY here,
      # because the database it derives into is created and destroyed with the job. It must never
      # become a literal in this file.
      #
      # `NOTIFY_PUBLIC_URL` is the one non-secret: notify builds the link in a notification from it,
      # and the smoke test never sends one.
      #
      # EVERY LINE IN THIS BLOCK BECOMES ONE `-e` ARGUMENT, so a comment inside it is passed to
      # `docker run` as an environment variable named `#`. The commentary lives out here.
      # ── WHAT WAVE M5b ADDED: THE COMMERCE/GAMES TIER'S DECLARED CONFIGURATION ────────────────
      #
      # Every line below is a variable one of the seven M5b modules REQUIRES at import (its `env.ts`
      # exits before /livez otherwise) or reads at boot. The URLs are CI-only non-secrets, never
      # dialled — /livez makes no outbound call and the modules' upstream probes are soft, so a
      # merged replica answers /livez while every commerce upstream is a dead 127.0.0.1. The two
      # `@generate` lines are module ingest/inbound secrets (community's own list, tessera's inbound
      # webhook key held apart from OUTBOX_SIGNING_SECRET); `COMMUNITY_IDENTITY_CREDENTIAL` mints the
      # `cfsc_` shape its ledger client presents. The `ci-only-not-a-real-token-…` values are the
      # deliberately non-secret-shaped placeholders billing and mint carried standalone — @cloudsforge
      # /secrets does not guard them, and a typed placeholder is exactly what the boot guard permits
      # where a secret-shaped literal is refused. That this block grew by nineteen lines IS the
      # commerce/games merge stated as configuration.
      # ── WHAT WAVE M5d ADDED: FIVE LINES, AND ONE DATABASE ───────────────────────────────────
      #
      # `WALLET_URL`, `IDENTITY_URL`, `ACTIVITY_URL` and `NOTIFY_URL` are four of the EIGHT upstream
      # URLs hub's `env.ts` requires at import; the other four (`LEDGER_URL`, `BILLING_URL`,
      # `PRICING_URL`, `POLICY_URL`) are already above under the same estate-wide names. hub is the
      # one module here that declares NO database, which is why no `HUB_DATABASE_URL` joins the
      # list above.
      #
      # `TRADE_SERVICE_TOKEN` is trade's own scoped credential (SD-05), and it is the
      # `ci-only-not-a-real-token-…` shape rather than `@generate` for the same reason billing's and
      # mint's are: it is a static bearer this module PRESENTS, `@cloudsforge/secrets` does not
      # guard that shape, and nothing in the smoke test verifies it against anything.
      # `TRADE_DATABASE_URL` joins `database-env-var` above, which is what makes
      # `TRADE_TEST_DATABASE_URL` exist for `src/trade/*.test.ts` — without it those suites SKIP,
      # and the shared workflow fails the build on a skip it provided a database for.
      # `WALLET_DATABASE_URL` joins it for the same reason.
      #
      # wallet's two remaining boot-REQUIRED variables are the SIWE challenge pair: they are the
      # domain and URI a user's wallet signs over, so a wrong value is a signature that verifies
      # against the wrong site. Non-secrets, and `.test` deliberately — a CI literal that named the
      # real apex would be a working challenge for the production domain sitting in a public file.
      # Its other four upstreams (`LEDGER_URL`, `CUSTODY_URL`, `INDEXER_URL`, `PRICING_URL`) are
      # already above under the same estate-wide names, and `WALLET_IDENTITY_CREDENTIAL` is
      # deliberately optional — its absence is caught by `/readyz`, which is a check that can fail,
      # rather than by a boot CI cannot perform.
      #
      # admin's four: `MARKET_URL` and `NDA_URL` are the two peers no other module names (its other
      # six — `IDENTITY_*`, `LEDGER_URL`, `NOTIFY_URL`, `BILLING_URL` — are already above).
      # `ADMIN_API_ESTATE_ENVIRONMENT` is the value `estate_identity` is claimed with on first boot
      # and COMPARED against on every boot after; `development` here, as admin-api's own CI used,
      # because the smoke database is created and destroyed with the job. It is not decoration: a
      # wrong value poisons every backup taken afterwards, because a restore is refused on it by
      # `restore_runs_environment_matches()`.
      # `ADMIN_API_IDENTITY_CREDENTIAL=@credential` is optional to BOOT and set anyway, for the
      # reason admin-api's own workflow gave: a smoke test that booted the credential-less mode
      # would be testing the configuration micro-org #222 exists to retire.
      #
      # emberkin's THREE databases, and one URL. `EMBERKIN_DATABASE_URL`, `AETHERHOLM_DATABASE_URL`
      # and `NDA_DATABASE_URL` all join `database-env-var` because emberkin is itself a merged
      # process — one factory call, three titles, three schemas asserted before the listener binds.
      # `WORLDS_URL` is the one peer no other module names; `LEDGER_URL`, `BILLING_URL` and the
      # `IDENTITY_*` pair are already above. `EMBERKIN_IDENTITY_CREDENTIAL` is `@credential` rather
      # than `EMBERKIN_SERVICE_TOKEN`, because the static-token mode is the defect micro-org#228
      # exists to retire and a smoke test that booted it would be testing that.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=@generate
        AGORA_IDENTITY_CREDENTIAL=@credential
        DEVPLATFORM_INGEST_SECRETS=@generate
        STUDIO_ASSET_ROOT=/tmp/studio-assets
        LEDGER_URL=http://127.0.0.1:4007
        LEDGER_BASE_URL=http://127.0.0.1:4002
        POLICY_URL=http://127.0.0.1:4006
        POLICY_BASE_URL=http://127.0.0.1:4003
        INDEXER_URL=http://127.0.0.1:4008
        CUSTODY_URL=http://127.0.0.1:4005
        PRICING_URL=http://127.0.0.1:4009
        BILLING_URL=http://127.0.0.1:4009
        BILLING_LEDGER_URL=http://127.0.0.1:4007
        BILLING_PRICING_URL=http://127.0.0.1:4009
        COMMUNITY_INGEST_SECRETS=@generate
        COMMUNITY_IDENTITY_CREDENTIAL=@credential
        INBOUND_SIGNING_SECRET=@generate
        BILLING_LEDGER_TOKEN=ci-only-not-a-real-token-0000000000000
        MINT_SERVICE_TOKEN=ci-only-not-a-real-token-0000000000000
        FORESIGHT_TREASURY_ADDRESS=0x0000000000000000000000000000000000000001
        FORESIGHT_ORACLE_ADDRESS=0x0000000000000000000000000000000000000002
        FORESIGHT_ORACLE_USER_ID=ci
        FORESIGHT_ORACLE_ORDER_ID=ci-oracle
        ACTIVITY_INGEST_SECRETS=@generate
        NOTIFY_INGEST_SIGNING_SECRET=@generate
        NOTIFY_PUBLIC_URL=http://127.0.0.1:4000
        LANTERN_TOKEN=@generate
        ANALYTICS_TOKEN=@generate
        ANALYTICS_PSEUDONYM_KEY=@generate
        ANALYTICS_DELIVERY_SECRETS=@generate
        WALLET_URL=http://127.0.0.1:4010
        IDENTITY_URL=http://127.0.0.1:4001
        ACTIVITY_URL=http://127.0.0.1:4011
        NOTIFY_URL=http://127.0.0.1:4012
        TRADE_SERVICE_TOKEN=ci-only-not-a-real-token-0000000000000
        WALLET_CHALLENGE_DOMAIN=cloudsforge.test
        WALLET_CHALLENGE_URI=https://cloudsforge.test/login
        MARKET_URL=http://127.0.0.1:4013
        NDA_URL=http://127.0.0.1:4116
        ADMIN_API_ESTATE_ENVIRONMENT=development
        ADMIN_API_IDENTITY_CREDENTIAL=@credential
        WORLDS_URL=http://127.0.0.1:4118
        EMBERKIN_IDENTITY_CREDENTIAL=@credential
    secrets:
      # @cloudsforge/* resolves by link:../runtime and link:../contracts, so CI checks out
      # micro-runtime and micro-contracts as siblings — both private, so the workflow needs a
      # contents:read token. This service takes BOTH: `src/outbox.ts` imports
      # @cloudsforge/contracts-events for the topic names and the envelope, and `src/policyclient.ts`
      # imports @cloudsforge/contracts-auth for LiveScope.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  migrate:
    # ── BESPOKE, AND IT HAS TO STAY BESPOKE ────────────────────────────────────────────────────
    #
    # The reusable workflow's `migrate-command` is a single command line and its image job runs it
    # once. That is still true and still fine for the IMAGE smoke test — `pnpm migrate` migrates
    # every database this deployable owns in one process, sequentially, because `src/migrator.ts`
    # builds one target list from all five modules. What this job adds is what the reusable one
    # cannot: the migrator run AS a deploy runs it, on EMPTY databases, and run TWICE to prove it is
    # idempotent — because a deploy re-runs the one-shot Job on every release.
    #
    # Wave M5a made it five databases, M5b twelve, M5c SIXTEEN. Fifteen of them are created below
    # rather than by the service container, which can only make one.
    #
    # `src/migrator.ts` imports every module's `module.ts`, and each of those imports its `env.ts`,
    # which VALIDATES AT IMPORT. So this job's `env:` block is the authority on what the migrator
    # needs — not just the sixteen DSNs but every upstream URL and scalar those sixteen
    # configurations demand. A missing one is an `exit(1)` before a single statement is issued,
    # naming a variable that has nothing to do with migrations.
    name: The migrator, on twenty-two empty databases
    runs-on: ubuntu-latest
    # `contents: read`, declared, so the default GITHUB_TOKEN can read the public sibling repos when
    # the fallback below reaches for it. The reusable `ci` job declares the same at its call site.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        # Not a secret: this database lives for one job, is reachable only from it, and holds nothing.
        env:
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: agora
          POSTGRES_DB: agora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGORA_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/agora_test
      # THE OTHER FOUR. Each distinct from the first, and `src/migratortargets.ts` refuses to issue
      # a statement if any two ever stop being: `inbox` and `jobs` exist in all five schemas, and
      # `outbox`, `event_subscriptions` and `outbox_deliveries` in four, so one shared database is
      # two `create table inbox` racing and then the later modules' tables never created — with a
      # migrator that exits 0. Created in the step below; the service container makes only
      # POSTGRES_DB.
      DEVPLATFORM_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/devplatform_test
      POLICY_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/policy_test
      PRICING_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/pricing_test
      STUDIO_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/studio_test
      # The M5b seven. Each a distinct database on the same server; `src/migratortargets.ts` refuses
      # to issue a statement if any two of the twelve ever stop being distinct.
      COMMUNITY_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/community_test
      MARKET_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/market_test
      BILLING_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/billing_test
      MINT_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/mint_test
      FORESIGHT_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/foresight_test
      WORLDS_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/worlds_test
      TESSERA_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/tessera_test
      # The M5c four. activity and lantern each brought a nested module, so four databases arrive on
      # two absorbed repositories — and `src/migrator.ts` reaches them through
      # `activityMigrationTargets()` and `lanternMigrationTargets()`, each of which includes its
      # nested module's. The nesting is preserved in the migrator exactly as it is in the process.
      ACTIVITY_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/activity_test
      NOTIFY_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/notify_test
      LANTERN_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/lantern_test
      ANALYTICS_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/analytics_test
      # The M5d six. FIVE absorbed repositories, SIX databases: `emberkinMigrationTargets()`
      # returns three of them from one call, because emberkin is itself a merged process and the
      # nesting is preserved in the migrator exactly as it is in the process.
      #
      # hub is deliberately ABSENT and has no `HUB_DATABASE_URL` to be absent: it owns no table, so
      # it declares no migration targets, so `src/migrator.ts` never imports `src/hub/module.ts`
      # and never brings its eight required upstream URLs into this job's scope. That is a fact
      # worth being sure of rather than assuming in either direction — the migrator records it
      # beside its import list.
      TRADE_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/trade_test
      WALLET_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/wallet_test
      ADMIN_API_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/admin_api_test
      EMBERKIN_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/emberkin_test
      AETHERHOLM_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/aetherholm_test
      NDA_DATABASE_URL: postgres://agora:agora@127.0.0.1:5432/nda_test
      IDENTITY_JWKS_URL: http://127.0.0.1:4001/.well-known/jwks.json
      IDENTITY_ISSUER: http://127.0.0.1:4001
      # The M5b modules' env.ts validates at import, and `src/migrator.ts` imports every module.ts
      # (which imports its env.ts) — so the migrator would exit 1 before touching a schema without
      # the upstream URLs and scalars those modules REQUIRE. CI-only non-secrets, never dialled: the
      # migrator opens pools, it makes no outbound call. The `ci-only-not-a-real-token-…` values are
      # not secret-shaped, so @cloudsforge/secrets does not guard them.
      LEDGER_URL: http://127.0.0.1:4007
      LEDGER_BASE_URL: http://127.0.0.1:4002
      POLICY_URL: http://127.0.0.1:4006
      POLICY_BASE_URL: http://127.0.0.1:4003
      INDEXER_URL: http://127.0.0.1:4008
      CUSTODY_URL: http://127.0.0.1:4005
      PRICING_URL: http://127.0.0.1:4009
      BILLING_URL: http://127.0.0.1:4009
      BILLING_LEDGER_URL: http://127.0.0.1:4007
      BILLING_PRICING_URL: http://127.0.0.1:4009
      BILLING_LEDGER_TOKEN: ci-only-not-a-real-token-0000000000000
      MINT_SERVICE_TOKEN: ci-only-not-a-real-token-0000000000000
      FORESIGHT_TREASURY_ADDRESS: '0x0000000000000000000000000000000000000001'
      FORESIGHT_ORACLE_ADDRESS: '0x0000000000000000000000000000000000000002'
      FORESIGHT_ORACLE_USER_ID: ci
      FORESIGHT_ORACLE_ORDER_ID: ci-oracle
      # notify's `env.ts` REQUIRES this — it is the origin every notification link is built from —
      # and `src/migrator.ts` imports every module's `module.ts`, which imports its `env.ts`. So
      # without it this job exits 1 before touching a schema, naming a variable that has nothing to
      # do with migrations. A CI-only non-secret, never dialled: the migrator opens pools and makes
      # no outbound call.
      NOTIFY_PUBLIC_URL: http://127.0.0.1:4111
      # ── WAVE M5d: WHAT THE FOUR NEW MODULES REQUIRE AT IMPORT ────────────────────────────────
      #
      # Same rule as the block above, four modules later. Each `env.ts` validates at import and
      # `src/migrator.ts` imports every module that declares a migration target, so the migrator
      # exits 1 naming one of these before it touches a schema.
      #
      # `WALLET_CHALLENGE_*` is the SIWE pair a user's wallet signs over — `.test` deliberately,
      # because a CI literal naming the real apex would be a working challenge for the production
      # domain in a public file. `ADMIN_API_ESTATE_ENVIRONMENT` is the value `estate_identity` is
      # claimed with; `development` here, because this database lives for one job.
      # `TRADE_SERVICE_TOKEN` is trade's OWN static bearer (SD-05) rather than a legacy slot beside
      # a credential, which is why it is a non-secret-shaped literal here and not `@generate`.
      MARKET_URL: http://127.0.0.1:4013
      NDA_URL: http://127.0.0.1:4116
      WORLDS_URL: http://127.0.0.1:4118
      NOTIFY_URL: http://127.0.0.1:4011
      IDENTITY_URL: http://127.0.0.1:4001
      TRADE_SERVICE_TOKEN: ci-only-not-a-real-token-0000000000000
      WALLET_CHALLENGE_DOMAIN: cloudsforge.test
      WALLET_CHALLENGE_URI: https://cloudsforge.test/login
      ADMIN_API_ESTATE_ENVIRONMENT: development
      # OUTBOX_SIGNING_SECRET, DEVPLATFORM_INGEST_SECRETS, COMMUNITY_INGEST_SECRETS,
      # INBOUND_SIGNING_SECRET and COMMUNITY_IDENTITY_CREDENTIAL are deliberately NOT here — they are
      # generated per run in the first step below, because @cloudsforge/secrets refuses a literal.
      # Wave M5c adds six more to that step: ACTIVITY_INGEST_SECRETS, NOTIFY_INGEST_SIGNING_SECRET,
      # LANTERN_TOKEN, ANALYTICS_TOKEN, ANALYTICS_PSEUDONYM_KEY and ANALYTICS_DELIVERY_SECRETS.
    steps:
      # THE KEY MATERIAL IS GENERATED, not written into the mapping above.
      #
      # `@generate` is a feature of service-ci.yml's `smoke-env` input and nothing substitutes it in
      # a bespoke job's `env:`, so a literal here would reach the migrator as written — and the boot
      # guard refuses the literals that used to sit in files like this one (micro-org #212).
      # `src/migrator.ts` imports the modules' `module.ts`, which import their `env.ts`, so this job
      # validates all five configurations and would exit 1 before touching a schema.
      #
      # Generated per run and thrown away. Masked before either is written, so a later step that
      # dumps its environment cannot put one in the log; nothing here ever prints them.
      - name: Real key material, for this run only
        run: |
          set -euo pipefail
          # Wave M5b: community's own ingest list and tessera's inbound-webhook key join the two the
          # M5a modules need. Each module's env.ts runs @cloudsforge/secrets at import and refuses a
          # value not shaped like a generated one — so a real one is minted per run and thrown away.
          # Wave M5c: activity's and notify's ingest accept-lists, lantern's and analytics' static
          # read tokens, analytics' delivery accept-list, and analytics' PEPPER. The pepper is the
          # one value in this estate that cannot be rotated without orphaning the history derived
          # under it — minted per run and thrown away here, and never a literal anywhere.
          for name in OUTBOX_SIGNING_SECRET DEVPLATFORM_INGEST_SECRETS COMMUNITY_INGEST_SECRETS INBOUND_SIGNING_SECRET \
                      ACTIVITY_INGEST_SECRETS NOTIFY_INGEST_SIGNING_SECRET LANTERN_TOKEN ANALYTICS_TOKEN \
                      ANALYTICS_PSEUDONYM_KEY ANALYTICS_DELIVERY_SECRETS; do
            secret="$(openssl rand -base64 48)"
            echo "::add-mask::$secret"
            echo "${name}=${secret}" >> "$GITHUB_ENV"
          done
          # Wave M5d: emberkin's CREDENTIAL, which is a different shape and cannot come from the
          # loop above. `@cloudsforge/secrets` checks it is `cfsc_` + base64url — and base64 is not
          # base64url, so `openssl rand -base64` produces a value it refuses about a third of the
          # time (a `+` or a `/`) and accepts the rest, which is a flaky CI that looks like a flaky
          # migrator. `-base64 | tr` gives the right alphabet deterministically.
          #
          # It is REQUIRED rather than optional, unlike wallet's and admin's: that module presents a
          # bearer to billing, the ledger and worlds, and `env.ts` refuses to start rather than let
          # every one of those calls answer 503 with nothing naming the cause. The migrator imports
          # it, so this job needs it before it can touch a schema.
          credential="cfsc_$(openssl rand -base64 33 | tr '+/' '-_' | tr -d '=')"
          echo "::add-mask::$credential"
          echo "EMBERKIN_IDENTITY_CREDENTIAL=${credential}" >> "$GITHUB_ENV"
      # Temporary: the three checkouts exist only because the runtime and contracts packages are
      # unpublished. On publish this collapses to one checkout.
      #
      # ── THE TOKEN FALLS BACK TO github.token, AND THAT IS WHAT MAKES THIS RUN ──────────────────
      #
      # `ESTATE_READ_TOKEN` is not defined for this repository — a bare `token:
      # ${{ secrets.ESTATE_READ_TOKEN }}` interpolates to the empty string, and checkout@v4 rejects
      # an EXPLICIT-but-empty token with "Input required and not supplied: token" rather than
      # falling back on its own. The reusable `service-ci.yml` this repository's `ci` job calls has
      # always guarded against exactly this — `token: ${{ secrets.estate_token || github.token }}`
      # — and its sibling checkouts succeed here on the fallback, which proves micro-runtime and
      # micro-contracts are readable by the default job token. This bespoke job carries the same
      # guard rather than assuming a secret the reusable path never assumed.
      - uses: actions/checkout@v4
        with: { path: agora }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-runtime, path: runtime, token: "${{ secrets.ESTATE_READ_TOKEN || github.token }}" }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-contracts, path: contracts, token: "${{ secrets.ESTATE_READ_TOKEN || github.token }}" }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agora/pnpm-lock.yaml
      # `link:` resolves to the sibling's own node_modules, so the siblings must be installed
      # before this repository is — without this, `node --import tsx src/migrator.ts` cannot load
      # the runtime source's own imports (@opentelemetry/api, jose) and dies at the first one.
      - name: Install the sibling runtime and contracts
        run: |
          set -euo pipefail
          pnpm --dir runtime install --frozen-lockfile
          pnpm --dir contracts install --frozen-lockfile
      - name: Install
        working-directory: agora
        run: pnpm install --frozen-lockfile
      - name: The absorbed modules' databases
        # The Postgres service creates one database. The other four are made here, deliberately as
        # separate databases on the same server rather than schemas in the first — see the note on
        # DEVPLATFORM_DATABASE_URL above.
        run: |
          set -euo pipefail
          for db in devplatform_test policy_test pricing_test studio_test \
                    community_test market_test billing_test mint_test foresight_test worlds_test tessera_test \
                    activity_test notify_test lantern_test analytics_test \
                    trade_test wallet_test admin_api_test emberkin_test aetherholm_test nda_test; do
            PGPASSWORD=agora psql -h 127.0.0.1 -U agora -d agora_test -v ON_ERROR_STOP=1 \
              -c "create database ${db}"
          done
      - name: Migrate all twenty-two test databases
        working-directory: agora
        run: pnpm migrate
      - name: Migrating twice is a no-op
        working-directory: agora
        # A deploy re-runs the one-shot job on every release; a migrator that is not idempotent turns
        # the second deploy of an unchanged schema into an outage.
        run: pnpm migrate
      - name: All twenty-two schemas are actually there, and each in its OWN database
        # The failure this whole arrangement exists to prevent is a migrator that exits 0 having
        # created nothing. So the tables are counted rather than the exit code trusted, and each
        # database is checked for tables only the OTHER modules own — which is what a shared ledger,
        # or a target list pointed twice at one DSN, would produce.
        run: |
          set -euo pipefail
          q() { PGPASSWORD=agora psql -h 127.0.0.1 -U agora -d "$1" -tAc "$2"; }
          # database:minimum-tables — the module's own table count plus `schema_migrations`. A floor
          # rather than an equality, so adding a migration is not a CI edit; high enough that a
          # module whose migrator never ran cannot clear it.
          for pair in agora_test:28 devplatform_test:21 policy_test:11 pricing_test:9 studio_test:10 \
                      community_test:14 market_test:20 billing_test:15 mint_test:7 foresight_test:16 \
                      worlds_test:12 tessera_test:19 \
                      activity_test:4 notify_test:10 lantern_test:6 analytics_test:10 \
                      trade_test:18 wallet_test:14 admin_api_test:19 \
                      emberkin_test:9 aetherholm_test:21 nda_test:16; do
            db="${pair%%:*}"; floor="${pair##*:}"
            n=$(q "$db" "select count(*) from information_schema.tables where table_schema='public'")
            echo "${db}: ${n} tables (floor ${floor})"
            [ "$n" -ge "$floor" ] || { echo "::error::${db} is missing its schema — that module's migrator did not run"; exit 1; }
          done
          # One table each module owns ALONE — `src/migratortargets.test.ts` measures that these
          # five are unique to their owner. Each must be absent from the other four databases, or
          # the ledgers have been confused. Every ordered pair, because a check that only compared
          # each module against ONE other is a check five modules can walk through.
          for owner in agora_test:voices devplatform_test:api_keys policy_test:policy_decisions pricing_test:price_quotes studio_test:brand_kits \
                       community_test:communities market_test:bids billing_test:invoices mint_test:tokens \
                       foresight_test:house_seeds worlds_test:player_profiles tessera_test:beacons \
                       activity_test:activity_records notify_test:deliveries lantern_test:rum_samples analytics_test:subject_keys \
                       trade_test:backtests wallet_test:deposit_credits admin_api_test:approvals \
                       emberkin_test:saves aetherholm_test:archipelagos nda_test:communes; do
            odb="${owner%%:*}"; table="${owner##*:}"
            [ "$(q "$odb" "select count(*) from information_schema.tables where table_name='${table}'")" = "1" ] \
              || { echo "::error::${odb} does not have its own ${table}"; exit 1; }
            for other in agora_test devplatform_test policy_test pricing_test studio_test \
                         community_test market_test billing_test mint_test foresight_test worlds_test tessera_test \
                         activity_test notify_test lantern_test analytics_test \
                         trade_test wallet_test admin_api_test emberkin_test aetherholm_test nda_test; do
              [ "$other" = "$odb" ] && continue
              [ "$(q "$other" "select count(*) from information_schema.tables where table_name='${table}'")" = "0" ] \
                || { echo "::error::${odb}'s ${table} was created in ${other}"; exit 1; }
            done
          done
          # And each ledger records its OWN module's versions, under its own service name.
          for db in agora_test devplatform_test policy_test pricing_test studio_test \
                    community_test market_test billing_test mint_test foresight_test worlds_test tessera_test \
                    activity_test notify_test lantern_test analytics_test; do
            n=$(q "$db" "select count(*) from schema_migrations")
            echo "${db}: ${n} migrations recorded"
            [ "$n" -gt 0 ] || { echo "::error::${db} has an empty migration ledger"; exit 1; }
          done

  # The image this service ships, published where a deploy can pull it. Without this job the
  # repository builds an image in CI and throws it away, and `cfctl release` writes a manifest
  # naming an image that does not exist — which `cfctl release --verify` and
  # `deploy/scripts/release-deploy.sh` both refuse.
  publish:
    needs: [ci, hygiene]
    # Only a green push to main or a release branch publishes. Not a pull request: a tag that can be
    # produced by an unmerged change is a tag a release manifest cannot trust.
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      # `write`, and it must be granted HERE. A called workflow's token can only be reduced, never
      # elevated, so publish-image.yml cannot ask for this on the caller's behalf — leaving it at
      # `read` fails the run at startup rather than at the push.
      packages: write

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read
