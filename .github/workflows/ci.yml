name: CI

# The whole file. If this repository ever grows a job of its own, `cfctl doctor` reports it as a
# bespoke CI file and the count in docs/ecosystem/03 §5 stops being zero — which is the signal
# that the reusable workflow needs an input, not that this repository needs its own copy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: agora
      database-env-var: AGORA_DATABASE_URL
      port: 4150
    permissions:
      contents: read
      packages: read

  # The image this service ships, published where a deploy can pull it. Without this job the
  # repository builds an image in CI and throws it away, and `cfctl release` writes a manifest
  # naming an image that does not exist — which `cfctl release --verify` and
  # `deploy/scripts/release-deploy.sh` both refuse.
  publish:
    needs: ci
    # Only a green main push publishes. Not a pull request, not a branch: a tag that can be
    # produced by an unmerged change is a tag a release manifest cannot trust.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    permissions:
      contents: read
      # `write`, and it must be granted HERE. A called workflow's token can only be reduced, never
      # elevated, so publish-image.yml cannot ask for this on the caller's behalf — leaving it at
      # `read` fails the run at startup rather than at the push.
      packages: write

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read
